[package]
name = "achievement-nexus"
version = "0.1.0-beta.1"
description = "A personal achievement tracker for gamers"
authors = ["Achievement Nexus"]
edition = "2021"

[lib]
name = "achievement_nexus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "custom-protocol"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
tauri-plugin-updater = "=2.10.1"
tauri-plugin-notification = "2"
notify = "8"
url = "2"
sysinfo = "0.33"
uuid = { version = "1", features = ["v4"] }
discord-presence = "3.2"
reqwest = { version = "0.13.4", features = ["json"] }

[target.'cfg(windows)'.dependencies]
# MIT/Apache-2.0. Direct Windows Credential Manager bindings; no secret is
# serialized to SQLite, a config file, or frontend storage.
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security_Credentials"
] }

[dev-dependencies]
# `test` exposes tauri::test::{mock_builder, mock_context}, used to assert that
# every plugin the app depends on is actually registered in the builder.
tauri = { version = "2", features = ["test"] }
